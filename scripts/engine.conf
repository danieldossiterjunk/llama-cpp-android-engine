# engine.conf - every pinned input of LLAMA_CPP_ANDROID_ARM64_ENGINE_001.
# Sourced by build_engine.sh, ci_pipeline.sh and arm64_linux_smoke.sh.
# Change a value here only together with a new package name.

PACKAGE_ID="LLAMA_CPP_ANDROID_ARM64_ENGINE_001"

# Upstream source: official ggml-org repository, semantic-version release tag.
LLAMA_REPO_URL="https://github.com/ggml-org/llama.cpp"
LLAMA_DEFAULT_BRANCH="master"
LLAMA_TAG="v1.0.0"
LLAMA_TAG_OBJECT="a6d1a74dbebce3a16f4f2ceddbf38c21a08d8674"   # annotated tag object
LLAMA_COMMIT="b1b770d90d94cad9e9ea5b993bdbc383a522fb28"       # commit the tag points to
LLAMA_NIGHTLY_ALIAS="b12359"                                  # upstream also tags it v1.0.0-b12359-b1b770d

# Toolchain: official Android NDK and SDK CMake, installed by Google's sdkmanager.
NDK_VERSION="29.0.14206865"       # same NDK as upstream's own Android release job
SDK_CMAKE_VERSION="3.31.6"        # CMake + Ninja package from the Android SDK
JAVA_CHECK_PLATFORM="android-29"  # APK Builder 004 compile_api

# Target
ANDROID_ABI="arm64-v8a"
ANDROID_API="28"                  # API level the engine libraries are built for (= project min_sdk)
APKB_BRIDGE_API="26"              # API level APK Builder 004 compiles a jni/ bridge for
CPU_ARCH="armv8.2-a+dotprod+fp16" # portable CPU baseline for the ggml CPU backend

# Outputs
ENGINE_LIBS="libggml-base.so libggml-cpu.so libggml.so libllama.so"
PUBLIC_HEADERS="include/llama.h include/llama-cpp.h ggml/include/ggml.h ggml/include/ggml-alloc.h ggml/include/ggml-backend.h ggml/include/ggml-cpu.h ggml/include/ggml-opt.h ggml/include/gguf.h ggml/include/ggml-cpp.h"
C_API_HEADERS="llama.h ggml.h ggml-alloc.h ggml-backend.h ggml-cpu.h ggml-opt.h gguf.h"

# Linux ARM64 smoke test only (not Android): tiny public test model used by upstream CI
SMOKE_MODEL_URL="https://huggingface.co/ggml-org-dev/stories15M/resolve/main/stories15M.gguf"
